[project]
name = "xiangji-cgir"
version = "0.1.0"
description = "Reproducible baselines and models for constrained historical incense reconstruction"
requires-python = ">=3.11"
dependencies = [
  "latex2mathml==3.81.1",
  "mathml2omml==0.0.2",
  "numpy>=2.0",
  "pandas>=2.2",
  "python-docx>=1.2",
  "rdkit==2026.3.3",
  "scikit-learn>=1.7",
  "scipy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xiangji"]

[dependency-groups]
dev = [
  "matplotlib>=3.10",
  "pytest>=8.3",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
